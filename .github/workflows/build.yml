name: build
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 7.5.1 }
      - run: |
          printf '%s' '' | base64 -d > p.zip
          unzip -q p.zip
          cd motasil && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: motasil-apk
          path: motasil/app/build/outputs/apk/debug/app-debug.apk
